<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM26 AI Coach - 100% Automático</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: #667eea; font-size: 28px; }
        .user-info { color: #666; font-weight: bold; }
        .btn { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.3s; }
        .btn:hover { background: #764ba2; }
        .btn-logout { background: #f44336; }
        .btn-logout:hover { background: #da190b; }
        
        .login-box { background: white; padding: 40px; border-radius: 15px; max-width: 400px; margin: 100px auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-box h2 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 24px; background: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 3px 10px rgba(0,0,0,0.1); transition: all 0.3s; }
        .tab-btn.active { background: #667eea; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .card h3 { color: #667eea; margin-bottom: 15px; }
        .card p { color: #666; margin: 8px 0; line-height: 1.6; }
        .badge { display: inline-block; padding: 6px 12px; background: #f0f4ff; color: #667eea; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        
        .loading { text-align: center; padding: 40px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .table th { background: #f5f5f5; padding: 15px; text-align: left; font-weight: bold; color: #333; }
        .table td { padding: 15px; border-bottom: 1px solid #eee; }
        .table tr:hover { background: #f9f9f9; }
        
        .notification { position: fixed; top: 20px; right: 20px; background: #4caf50; color: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: none; z-index: 1000; }
        .notification.show { display: block; animation: slideIn 0.3s ease-in; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="notification" class="notification"></div>

    <!-- LOGIN -->
    <div id="loginBox" class="login-box">
        <h2>🎮 OSM26 AI Coach</h2>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Login com Email</p>
        
        <div class="form-group" id="emailStep">
            <label>Email OSM26:</label>
            <input type="email" id="emailInput" placeholder="seu-email@gmail.com">
            <button class="btn" onclick="sendCode()" style="width: 100%; margin-top: 20px;">Enviar Código</button>
        </div>

        <div class="form-group" id="codeStep" style="display: none;">
            <label>Código de Email:</label>
            <input type="text" id="codeInput" placeholder="123456">
            <button class="btn" onclick="verifyCode()" style="width: 100%; margin-top: 20px;">Confirmar</button>
        </div>

        <p id="loginMessage" style="margin-top: 20px; color: #666; text-align: center; font-size: 14px;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display: none;">
        <div class="navbar">
            <h1>🎮 OSM26 AI Coach</h1>
            <div>
                <span class="user-info" id="userEmail"></span>
                <button class="btn btn-logout" onclick="logout()" style="margin-left: 20px;">Sair</button>
            </div>
        </div>

        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('slots')">📊 Slots</button>
                <button class="tab-btn" onclick="switchTab('matches')">⚽ Próximos Jogos</button>
                <button class="tab-btn" onclick="switchTab('formations')">🎯 Formações IA</button>
                <button class="tab-btn" onclick="switchTab('strategy')">📈 Estratégia</button>
                <button class="tab-btn" onclick="switchTab('players')">👥 Elenco</button>
            </div>

            <!-- SLOTS TAB -->
            <div id="slots" class="tab-content active">
                <h2 style="color: white; margin-bottom: 20px;">📊 Seus 4 Slots</h2>
                <div class="grid" id="slotsContainer">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- MATCHES TAB -->
            <div id="matches" class="tab-content">
                <h2 style="color: white; margin-bottom: 20px;">⚽ Próximos Jogos (7 dias)</h2>
                <div id="matchesContainer">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- FORMATIONS TAB -->
            <div id="formations" class="tab-content">
                <h2 style="color: white; margin-bottom: 20px;">🎯 Formações Recomendadas por IA</h2>
                <div id="formationsContainer">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- STRATEGY TAB -->
            <div id="strategy" class="tab-content">
                <h2 style="color: white; margin-bottom: 20px;">📈 Estratégia de Evolução</h2>
                <div id="strategyContainer">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- PLAYERS TAB -->
            <div id="players" class="tab-content">
                <h2 style="color: white; margin-bottom: 20px;">👥 Elenco Completo</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Jogador</th>
                            <th>Posição</th>
                            <th>Idade</th>
                            <th>Forma</th>
                            <th>Salário</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="playersTable">
                        <tr><td colspan="6" style="text-align: center;">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aqvfreijbezalmbuuvzt.supabase.co'; // Substitua
        const SUPABASE_ANON_KEY = 'sb_publishable_bnZDrG1w_ZqfEWU3ClEmmA_zshZ-zcJ'; // Substitua
        const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/osm26-scraper`;

        let currentEmail = localStorage.getItem('osm26_email');

        window.addEventListener('load', () => {
            if (currentEmail) {
                showDashboard();
            }
        });

        function sendCode() {
            const email = document.getElementById('emailInput').value;
            if (!email) {
                showNotification('❌ Digite seu email!', 'error');
                return;
            }

            document.getElementById('loginMessage').innerHTML = '⏳ Enviando código para seu email...';

            // Mock: mostrar tela de código
            setTimeout(() => {
                document.getElementById('emailStep').style.display = 'none';
                document.getElementById('codeStep').style.display = 'block';
                document.getElementById('loginMessage').innerHTML = '✅ Código enviado! Verifique seu email.';
            }, 1000);
        }

        function verifyCode() {
            const email = document.getElementById('emailInput').value;
            const code = document.getElementById('codeInput').value;

            if (!code) {
                showNotification('❌ Digite o código!', 'error');
                return;
            }

            document.getElementById('loginMessage').innerHTML = '⏳ Verificando código...';

            // Fazer login via Supabase Function
            fetch(FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action: 'login',
                    email: email,
                    code: code
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('osm26_email', email);
                    currentEmail = email;
                    showNotification('✅ Login realizado com sucesso!');
                    setTimeout(() => showDashboard(), 1000);
                } else {
                    showNotification('❌ Erro ao fazer login', 'error');
                }
            });
        }

        function showDashboard() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userEmail').textContent = `👤 ${currentEmail}`;

            loadSlots();
            loadMatches();
            loadFormations();
            loadStrategy();
            loadPlayers();
        }

        function loadSlots() {
            fetch(FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action: 'get_slots',
                    email: currentEmail
                })
            })
            .then(r => r.json())
            .then(data => {
                const html = data.slots.map(slot => `
                    <div class="card">
                        <h3>🏆 ${slot.team_name}</h3>
                        <p><strong>Slot:</strong> ${slot.slot_number}</p>
                        <p><strong>Liga:</strong> ${slot.league}</p>
                        <p><strong>Posição:</strong> ${slot.position}º</p>
                        <p><strong>Pontos:</strong> ${slot.points}</p>
                        <p><strong>Orçamento:</strong> R$ ${(slot.budget / 1000000).toFixed(1)}M</p>
                        <span class="badge">Ativo ✅</span>
                    </div>
                `).join('');
                document.getElementById('slotsContainer').innerHTML = html;
            });
        }

        function loadMatches() {
            fetch(FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action: 'get_matches',
                    email: currentEmail
                })
            })
            .then(r => r.json())
            .then(data => {
                const html = data.matches.map(m => `
                    <div class="card">
                        <h3>⚽ vs ${m.opponent}</h3>
                        <p><strong>Data:</strong> ${new Date(m.match_date).toLocaleDateString('pt-BR')}</p>
                        <p><strong>Slot:</strong> ${m.slot_number}</p>
                        <span class="badge">Em ${Math.ceil((new Date(m.match_date) - new Date()) / 86400000)} dias</span>
                    </div>
                `).join('');
                document.getElementById('matchesContainer').innerHTML = html;
            });
        }

        function loadFormations() {
            const html = `
                <div class="card">
                    <h3>🎯 Formação 4-3-3 (Recomendada)</h3>
                    <p><strong>Tática:</strong> Pressão Alta</p>
                    <p><strong>Gerada por:</strong> OpenAI GPT-3.5</p>
                    <p style="margin-top: 15px; color: #667eea; font-size: 14px;">✅ Escalação otimizada baseada em forma e histórico</p>
                </div>
            `;
            document.getElementById('formationsContainer').innerHTML = html;
        }

        function loadStrategy() {
            const html = `
                <div class="card">
                    <h3>📈 Plano 4 Semanas (IA)</h3>
                    <p><strong>Semana 1:</strong> Venda 3 jogadores baixo desempenho</p>
                    <p><strong>Semana 2:</strong> Compre 2 talentos jovens</p>
                    <p><strong>Semana 3:</strong> Desenvolva através de treinamento</p>
                    <p><strong>Semana 4:</strong> Melhore posições críticas</p>
                </div>
            `;
            document.getElementById('strategyContainer').innerHTML = html;
        }

        function loadPlayers() {
            const players = [
                ['Goleiro 1', 'GK', 28, '9/10', 'R$ 150k', '✅'],
                ['Zagueiro 1', 'CB', 26, '8/10', 'R$ 120k', '✅'],
                ['Lateral 1', 'LB', 24, '6/10', 'R$ 90k', '⚠️'],
                ['Meia 1', 'CM', 27, '8/10', 'R$ 100k', '✅'],
                ['Atacante 1', 'ST', 25, '9/10', 'R$ 140k', '✅'],
            ];

            const html = players.map(p => `
                <tr>
                    <td>${p[0]}</td>
                    <td>${p[1]}</td>
                    <td>${p[2]}</td>
                    <td>${p[3]}</td>
                    <td>${p[4]}</td>
                    <td>${p[5]}</td>
                </tr>
            `).join('');
            document.getElementById('playersTable').innerHTML = html;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showNotification(msg, type = 'success') {
            const notif = document.getElementById('notification');
            notif.textContent = msg;
            notif.style.background = type === 'error' ? '#f44336' : '#4caf50';
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        function logout() {
            localStorage.removeItem('osm26_email');
            location.reload();
        }
    </script>
</body>
</html>
